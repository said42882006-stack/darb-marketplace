    <!-- car (second, offset) -->
    <g transform="translate(190,340)">
      <path d="M2 26 L10 8 H46 L54 26" />
      <rect x="0" y="26" width="56" height="16" rx="4" />
      <circle cx="14" cy="44" r="6" />
      <circle cx="42" cy="44" r="6" />
