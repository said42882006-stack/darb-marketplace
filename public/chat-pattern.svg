      <circle cx="14" cy="44" r="6" />
      <circle cx="42" cy="44" r="6" />
    </g>

    <!-- chat bubble -->
    <g transform="translate(250,10)">
      <path d="M2 6 H50 V38 H20 L8 50 V38 H2 Z" />
      <circle cx="14" cy="22" r="2" />
      <circle cx="26" cy="22" r="2" />
      <circle cx="38" cy="22" r="2" />
    </g>

    <!-- truck -->
    <g transform="translate(350,30)">
      <rect x="0" y="10" width="34" height="20" />
      <path d="M34 16 H52 L60 26 V30 H34 Z" />
      <circle cx="12" cy="34" r="6" />
      <circle cx="48" cy="34" r="6" />
