<svg xmlns="http://www.w3.org/2000/svg" width="480" height="480" viewBox="0 0 480 480">
  <g fill="none" stroke="#2F6F6B" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" opacity="0.09">

    <!-- home -->
    <g transform="translate(20,20)">
      <path d="M4 22 L28 4 L52 22" />
      <path d="M10 20 V50 H46 V20" />
      <path d="M24 50 V32 H34 V50" />
    </g>

    <!-- car -->
    <g transform="translate(130,30)">
      <path d="M2 26 L10 8 H46 L54 26" />
