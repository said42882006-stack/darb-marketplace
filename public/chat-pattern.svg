    <g transform="translate(360,210)">
      <path d="M20 50 V22" />
      <path d="M20 22 C6 18 0 6 0 6 C6 4 16 8 20 22" />
      <path d="M20 22 C34 18 40 6 40 6 C34 4 24 8 20 22" />
